name: PHP

on:
  push:
    branches: [main]
    paths:
      - 'prototype/php/**'
      - '.github/workflows/php.yml'
  pull_request:
    paths:
      - 'prototype/php/**'
      - '.github/workflows/php.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/php
    steps:
      - uses: actions/checkout@v4

      - run: docker compose build

      # `lint` and `analyse` run against the `composer` entrypoint directly,
      # skipping the app entrypoint that installs Composer/npm dependencies
      # and builds assets. A runner starts with neither, so one plain run
      # primes them before `make check` touches the overridden entrypoint.
      - run: docker compose run --rm app true

      - run: make check
