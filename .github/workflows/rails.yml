name: Rails

on:
  push:
    branches: [main]
    paths:
      - 'prototype/rails/**'
      - '.github/workflows/rails.yml'
  pull_request:
    paths:
      - 'prototype/rails/**'
      - '.github/workflows/rails.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same command the pre-commit hook runs, driven through Docker: lint,
      # build the Tailwind stylesheet, then the coverage-gated suite.
      - run: make -C prototype/rails check
