name: Check

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/check.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - run: docker compose build

      # `lint` and `analyse` run against the `composer` entrypoint directly,
      # skipping the app entrypoint that installs Composer/npm dependencies
      # and builds assets. A runner starts with neither, so one plain run
      # primes them before `make ci` touches the overridden entrypoint.
      - run: docker compose run --rm app true

      # Lint and the ungated suite. The coverage floor is checked locally
      # by `make check` before a PR opens, not here: instrumenting the
      # suite is the slowest step of the gate and the floor moves only
      # when someone changes code, which they run `check` on.
      - run: make ci
