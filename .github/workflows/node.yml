name: Node

on:
  push:
    branches: [main]
    paths:
      - 'prototype/node/**'
      - '.github/workflows/node.yml'
  pull_request:
    paths:
      - 'prototype/node/**'
      - '.github/workflows/node.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/node/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prototype/node/src/package-lock.json

      - run: npm ci

      # CI has no compose stack, so it cannot run `make check` through Docker
      # like the pre-commit hook does. It runs the same `npm run check` the
      # Makefile's `check` target delegates to instead, so the hook and CI
      # run one identical command and cannot drift apart.
      - run: npm run check

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: prototype/node/src/coverage/lcov.info
