services:
  app:
    build: .
    # The Makefile exports the host uid and gid so files the container writes
    # into the bind mount belong to the host user.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/src
    volumes:
      - ./src:/var/www/src
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    command: ["node", "--watch", "app/server.ts"]
