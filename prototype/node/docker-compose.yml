services:
  app:
    build:
      context: .
      target: dev
    # The Makefile exports the host uid and gid so files the container writes
    # into the bind mount belong to the host user.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/src
    volumes:
      - ./src:/var/www/src
    ports:
      - "4000:4000"
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      # On the bind mount so every process — the 252 test-runner children
      # included — shares V8 compile artifacts across runs and containers.
      NODE_COMPILE_CACHE: /var/www/src/.cache/node-compile-cache
    command: ["node", "--watch", "app/server.ts"]
    healthcheck:
      # No curl in the image — node:sqlite already requires Node's own fetch.
      # start_period covers the entrypoint's npm ci / migrate / seed / assets
      # build, which runs before the server ever starts listening.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
