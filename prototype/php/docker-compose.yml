services:
  app:
    build:
      context: .
      target: dev
    working_dir: /var/www/src
    volumes:
      - ./src:/var/www/src
    ports:
      - "8000:8000"
    environment:
      # artisan serve is PHP's built-in server: one worker handles one
      # request at a time. The unread badge is a server-rendered count only
      # (no stream, no client polling), so nothing holds a worker open —
      # every request finishes and frees its worker in the same request
      # cycle. 4 covers ordinary concurrent browsing (a page's own asset
      # and XHR requests) with no held-connection cost to size against;
      # each worker costs about 5 MiB of the container.
      # --no-reload below is required for PHP_CLI_SERVER_WORKERS to take
      # effect at all.
      PHP_CLI_SERVER_WORKERS: "4"
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
