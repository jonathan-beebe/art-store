# Solid Cable keeps broadcasts in the application's own SQLite database, so
# live updates need no Redis and the stack stays one container. The single
# database configuration the gem documents: no connects_to, and
# solid_cable_messages in db/schema.rb alongside the rest.
development:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
